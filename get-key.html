<!DOCTYPE html><html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nhận Key — LoveMeizu</title><style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    font-family: Arial, sans-serif;
    color: white;
    background:
        radial-gradient(circle at 20% 20%, rgba(80,120,255,.25), transparent 35%),
        radial-gradient(circle at 80% 80%, rgba(0,220,255,.18), transparent 35%),
        #05070b;
}

.card {
    width: 100%;
    max-width: 430px;
    padding: 30px;
    border-radius: 28px;

    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.18);

    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);

    box-shadow:
        0 25px 80px rgba(0,0,0,.55),
        inset 0 1px 1px rgba(255,255,255,.15);

    text-align: center;
}

.logo {
    width: 72px;
    height: 72px;
    margin: 0 auto 18px;

    display: flex;
    justify-content: center;
    align-items: center;

    border-radius: 22px;
    font-size: 32px;

    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.2);

    box-shadow:
        inset 0 1px rgba(255,255,255,.2),
        0 10px 30px rgba(0,0,0,.3);
}

h1 {
    font-size: 25px;
    margin-bottom: 9px;
}

.subtitle {
    color: rgba(255,255,255,.65);
    font-size: 14px;
    line-height: 1.5;
    margin-bottom: 25px;
}

.status {
    min-height: 48px;
    padding: 14px;
    border-radius: 16px;

    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.1);

    font-size: 14px;
    color: rgba(255,255,255,.75);

    margin-bottom: 15px;
}

.key-box {
    display: none;
    margin-top: 15px;
}

.key {
    padding: 16px;
    border-radius: 16px;

    background: rgba(0,0,0,.25);
    border: 1px solid rgba(255,255,255,.15);

    font-size: 16px;
    font-weight: bold;

    word-break: break-all;
    margin-bottom: 12px;
}

button {
    width: 100%;
    border: 0;
    padding: 15px;
    border-radius: 16px;

    color: white;
    font-size: 15px;
    font-weight: bold;

    cursor: pointer;

    background: linear-gradient(
        135deg,
        rgba(80,130,255,.85),
        rgba(0,210,255,.65)
    );

    box-shadow:
        0 10px 30px rgba(0,150,255,.2);

    transition: .2s;
}

button:active {
    transform: scale(.97);
}

.error {
    color: #ff8f9a;
}

.success {
    color: #8dffcc;
}

.loading {
    color: rgba(255,255,255,.7);
}

.footer {
    margin-top: 20px;
    font-size: 12px;
    color: rgba(255,255,255,.4);
}
</style></head><body><div class="card"><div class="logo">🔑</div>

<h1>Nhận Key</h1>

<div class="subtitle">
    Share Apps Việt hoá<br>
    Tiện ích by LoveMeizu
</div>

<div id="status" class="status loading">
    Đang kiểm tra liên kết...
</div>

<div id="keyBox" class="key-box">

    <div id="key" class="key"></div>

    <button onclick="copyKey()">
        📋 Sao chép Key
    </button>

</div>

<div class="footer">
    LoveMeizu • Key System
</div>

</div><script>
const BACKEND_URL =
    "https://meizulover-key-backend.onrender.com";

const params =
    new URLSearchParams(window.location.search);

const token =
    params.get("token");

const statusEl =
    document.getElementById("status");

const keyBox =
    document.getElementById("keyBox");

const keyEl =
    document.getElementById("key");


function showError(message) {

    statusEl.className = "status error";
    statusEl.textContent = message;

}


async function loadKey() {

    if (!token) {

        showError(
            "❌ Liên kết không hợp lệ hoặc thiếu token."
        );

        return;
    }

    try {

        statusEl.className = "status loading";
        statusEl.textContent =
            "⏳ Đang xác nhận liên kết...";


        const infoResponse =
            await fetch(
                BACKEND_URL + "/session-info",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        token: token
                    })
                }
            );


        const info =
            await infoResponse.json();


        if (!info.success) {

            showError(
                "❌ Token không hợp lệ hoặc đã hết hạn."
            );

            return;
        }


        if (info.used === true) {

            showError(
                "❌ Key này đã được sử dụng."
            );

            return;
        }


        statusEl.className = "status loading";
        statusEl.textContent =
            "🔐 Đang lấy Key...";


        const claimResponse =
            await fetch(
                BACKEND_URL + "/claim",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        token: token
                    })
                }
            );


        const data =
            await claimResponse.json();


        if (!data.success) {

            if (data.error === "KEY_USED") {

                showError(
                    "❌ Key này đã được sử dụng."
                );

            } else {

                showError(
                    "❌ Không thể nhận Key."
                );
            }

            return;
        }


        keyEl.textContent =
            data.key;

        keyBox.style.display =
            "block";


        statusEl.className =
            "status success";

        statusEl.textContent =
            "✅ Nhận Key thành công!";


        /*
         * Xóa token khỏi thanh địa chỉ
         * nhưng không reload trang.
         */
        window.history.replaceState(
            {},
            document.title,
            window.location.pathname
        );

    } catch (error) {

        console.error(error);

        showError(
            "❌ Không thể kết nối máy chủ."
        );
    }
}


async function copyKey() {

    const key =
        keyEl.textContent;

    if (!key) return;

    try {

        await navigator.clipboard.writeText(key);

        statusEl.className =
            "status success";

        statusEl.textContent =
            "✅ Đã sao chép Key!";

    } catch (error) {

        showError(
            "Không thể sao chép tự động. Hãy giữ vào Key để sao chép."
        );
    }
}


loadKey();
</script></body>
</html>
