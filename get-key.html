<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lấy Key Kích Hoạt</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }
    .card {
      background: #ffffff;
      padding: 28px 20px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      text-align: center;
      max-width: 420px;
      width: 100%;
    }
    .card h2 { color: #1a1a1a; font-size: 20px; margin-bottom: 8px; }
    .card p { font-size: 14px; color: #666; margin-bottom: 20px; }
    .key-box {
      font-size: 17px;
      font-weight: 800;
      color: #28a745;
      background: #f4fbf7;
      padding: 14px;
      border-radius: 10px;
      border: 2px dashed #28a745;
      margin: 15px 0;
      word-break: break-all;
      letter-spacing: 0.5px;
    }
    .btn-copy {
      background: #007bff;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      width: 100%;
    }
    .btn-copy:active { opacity: 0.9; }
    #status {
      color: #fd7e14;
      font-size: 14px;
      font-weight: 600;
      margin: 15px 0;
      word-break: break-word;
    }
    .note {
      font-size: 12px;
      color: #dc3545;
      margin-top: 15px;
      font-style: italic;
    }
  </style>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
  <div class="card">
    <h2>🔑 KEY CỦA BẠN</h2>
    <p>Xác thực thành công qua Link4m</p>
    <div id="status">⏳ Đang kiểm tra hệ thống...</div>
    <div id="key-section" style="display: none;">
      <div class="key-box" id="generatedKey">meizulover_XXXXXXXXX</div>
      <button class="btn-copy" id="btnCopy" onclick="copyKey()">SAO CHÉP KEY</button>
      <p class="note">* Key chỉ sử dụng 1 LẦN. Để lấy Key mới, bạn phải vượt lại Link4m.</p>
    </div>
  </div>

  <script>
    // ===== CẤU HÌNH FIREBASE =====
    var firebaseConfig = {
      apiKey: "AIzaSyAhHdsZw5xwq_hmtU_oe9ELSgEw6L6pxvY",
      authDomain: "ogekeyl4m.firebaseapp.com",
      databaseURL: "https://ogekeyl4m-default-rtdb.asia-southeast1.firebasedatabase.app/",
      projectId: "ogekeyl4m",
      storageBucket: "ogekeyl4m.firebasestorage.app",
      messagingSenderId: "737277929162",
      appId: "1:737277929162:web:0a75c0f0a447d7ad63f633",
      measurementId: "G-JXG8PS8722"
    };

    function updateStatus(msg, isError) {
      var el = document.getElementById('status');
      el.style.display = 'block';
      el.innerText = msg;
      el.style.color = isError ? '#dc3545' : '#fd7e14';
    }

    // Chấp nhận cả: ?from=link4m  |  ?link4m  |  ?link4m=1
    function isFromLink4m() {
      var p = new URLSearchParams(window.location.search);
      var from = (p.get('from') || '').toLowerCase();
      if (from === 'link4m') return true;
      if (p.has('link4m')) return true;
      return false;
    }

    function generateMeizuKey(length) {
      length = length || 9;
      var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
      var result = '';
      for (var i = 0; i < length; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return 'meizulover_' + result;
    }

    function copyKey() {
      var keyText = document.getElementById('generatedKey').innerText;
      var btnCopy = document.getElementById('btnCopy');
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(keyText).then(function () {
          btnCopy.innerText = '✅ ĐÃ SAO CHÉP!';
          btnCopy.style.background = '#28a745';
          setTimeout(function () {
            btnCopy.innerText = 'SAO CHÉP KEY';
            btnCopy.style.background = '#007bff';
          }, 2000);
        }).catch(function () { fallbackCopy(keyText); });
      } else {
        fallbackCopy(keyText);
      }
    }

    function fallbackCopy(text) {
      var ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        alert('✅ Đã sao chép Key: ' + text);
      } catch (err) {
        alert('Key của bạn là: ' + text);
      }
      document.body.removeChild(ta);
    }

    // ===== MAIN =====
    if (!isFromLink4m()) {
      updateStatus('❌ LỖI: Truy cập bị từ chối! Bạn phải vượt link qua Link4m để lấy Key.', true);
    } else {
      // Xóa query trên thanh địa chỉ (giữ path)
      try {
        window.history.replaceState({}, document.title, window.location.pathname);
      } catch (e) {}

      try {
        if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }
        var database = firebase.database();
        var newKey = generateMeizuKey();

        updateStatus('⏳ Đang tạo Key kích hoạt...');

        // Ghi đúng nhánh /keys/ (khớp app Android + database hiện tại)
        database.ref('keys/' + newKey).set({
          created_at: new Date().toISOString(),
          used: false
        }).then(function () {
          document.getElementById('status').style.display = 'none';
          document.getElementById('generatedKey').innerText = newKey;
          document.getElementById('key-section').style.display = 'block';
        }).catch(function (error) {
          updateStatus('❌ Lỗi ghi Firebase: ' + error.message + '\n(Kiểm tra Rules: keys phải cho phép write)', true);
        });
      } catch (e) {
        updateStatus('❌ Lỗi kết nối: ' + e.message, true);
      }
    }
  </script>
</body>
</html>
