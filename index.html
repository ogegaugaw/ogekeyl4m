<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Nhận Key LoveMeizu</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {

  min-height: 100vh;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 20px;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  color: white;

  background:
    radial-gradient(
      600px 400px at 10% 0%,
      rgba(59,130,246,.25),
      transparent 65%
    ),
    radial-gradient(
      500px 400px at 100% 100%,
      rgba(0,200,255,.10),
      transparent 65%
    ),
    #050609;
}

.card {

  width: 100%;
  max-width: 420px;

  padding: 30px 22px;

  border-radius: 28px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.10),
      rgba(255,255,255,.035)
    );

  border:
    1px solid
    rgba(255,255,255,.14);

  backdrop-filter:
    blur(28px)
    saturate(140%);

  -webkit-backdrop-filter:
    blur(28px)
    saturate(140%);

  box-shadow:
    inset 0 1px
      rgba(255,255,255,.10),
    0 30px 80px
      rgba(0,0,0,.55);
}

.badge {

  display: inline-block;

  padding: 6px 11px;

  border-radius: 999px;

  color: #bfdbfe;

  background:
    rgba(59,130,246,.1);

  border:
    1px solid
    rgba(96,165,250,.2);

  font-size: 10px;
  font-weight: 700;

  letter-spacing: .07em;

  margin-bottom: 15px;
}

h1 {

  font-size: 23px;

  margin-bottom: 8px;
}

.sub {

  color: #a5a9b3;

  font-size: 13px;

  line-height: 1.6;

  margin-bottom: 20px;
}

.status {

  padding: 14px;

  border-radius: 15px;

  color: #fbbf24;

  background:
    rgba(255,255,255,.045);

  border:
    1px solid
    rgba(255,255,255,.08);

  font-size: 13px;

  font-weight: 600;

  line-height: 1.5;
}

.status.ok {

  color: #86efac;

  background:
    rgba(34,197,94,.07);

  border-color:
    rgba(34,197,94,.20);
}

.status.error {

  color: #fca5a5;

  background:
    rgba(239,68,68,.07);

  border-color:
    rgba(239,68,68,.20);
}

.key-section {

  display: none;

  margin-top: 18px;
}

.label {

  color: #8f95a1;

  font-size: 10px;

  font-weight: 700;

  letter-spacing: .08em;

  text-transform: uppercase;

  margin-bottom: 7px;
}

.key {

  padding: 16px;

  border-radius: 16px;

  color: #86efac;

  background:
    rgba(34,197,94,.08);

  border:
    1px solid
    rgba(34,197,94,.28);

  font-size: 15px;

  font-weight: 800;

  word-break: break-all;

  margin-bottom: 10px;

  text-align: center;
}

button {

  width: 100%;

  padding: 14px;

  border: 0;

  border-radius: 15px;

  color: white;

  background:
    linear-gradient(
      135deg,
      #3b82f6,
      #2563eb
    );

  font-size: 14px;

  font-weight: 800;

  cursor: pointer;

  box-shadow:
    0 10px 28px
    rgba(37,99,235,.28);

  transition:
    transform .15s ease,
    opacity .15s ease;
}

button:active {

  transform:
    scale(.98);
}

.note {

  margin-top: 14px;

  padding: 12px;

  border-radius: 13px;

  color: #aeb3bd;

  background:
    rgba(255,255,255,.035);

  font-size: 11px;

  line-height: 1.55;
}

.footer {

  margin-top: 20px;

  text-align: center;

  color: #666b76;

  font-size: 10px;
}

</style>

</head>

<body>

<div class="card">

  <div class="badge">
    ● SECURE ONE-TIME KEY
  </div>

  <h1>
    🔑 KEY CỦA BẠN
  </h1>

  <p class="sub">
    Hệ thống đang xác thực lượt nhận
    Key của bạn.
  </p>

  <div
    id="status"
    class="status">

    ⏳ Đang xác thực...

  </div>

  <div
    id="keySection"
    class="key-section">

    <div class="label">
      Activation Key
    </div>

    <div
      id="key"
      class="key">
      —
    </div>

    <button onclick="copyKey()">
      SAO CHÉP KEY
    </button>

    <div class="note">

      ⚠️ Key chỉ có thể sử dụng
      một lần. Sau khi APK xác nhận
      thành công, key sẽ bị vô hiệu hóa.

    </div>

  </div>

  <div class="footer">
    make by LoveMeizu
  </div>

</div>


<script>

/*
 * ==========================================
 * BACKEND
 * ==========================================
 */

const BACKEND_URL =
  "https://meizulover-key-backend.onrender.com";


/*
 * ==========================================
 * SESSION
 * ==========================================
 */

const params =
  new URLSearchParams(
    window.location.search
  );

const session =
  params.get("session");


/*
 * ==========================================
 * STATUS
 * ==========================================
 */

function setStatus(
  text,
  type
) {

  const el =
    document.getElementById(
      "status"
    );

  el.textContent =
    text;

  el.className =
    "status " +
    (type || "");

}


/*
 * ==========================================
 * LOAD KEY
 * ==========================================
 */

async function loadKey() {

  if (!session) {

    setStatus(
      "❌ Liên kết không hợp lệ. Hãy lấy Link4M mới.",
      "error"
    );

    return;
  }


  try {

    /*
     * Kiểm tra session
     */

    setStatus(
      "⏳ Đang kiểm tra liên kết...",
      ""
    );


    const infoResponse =
      await fetch(
        BACKEND_URL +
        "/session-info",
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              session: session
            })

        }
      );


    if (!infoResponse.ok) {

      throw new Error(
        "Backend HTTP " +
        infoResponse.status
      );

    }


    const info =
      await infoResponse.json();


    if (!info.success) {

      if (
        info.error ===
        "SESSION_EXPIRED"
      ) {

        throw new Error(
          "Session đã hết hạn. Hãy lấy Link4M mới."
        );

      }

      throw new Error(
        "Liên kết không hợp lệ. Hãy lấy Link4M mới."
      );

    }


    if (info.claimed === true) {

      throw new Error(
        "Key của lượt này đã được nhận trước đó."
      );

    }


    /*
     * Claim Key
     */

    setStatus(
      "⏳ Đang cấp Key...",
      ""
    );


    const claimResponse =
      await fetch(
        BACKEND_URL +
        "/claim",
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              session: session
            })

        }
      );


    if (!claimResponse.ok) {

      throw new Error(
        "Backend HTTP " +
        claimResponse.status
      );

    }


    const data =
      await claimResponse.json();


    if (!data.success) {

      if (
        data.error ===
        "KEY_ALREADY_CLAIMED"
      ) {

        throw new Error(
          "Key đã được nhận trước đó."
        );

      }

      if (
        data.error ===
        "SESSION_EXPIRED"
      ) {

        throw new Error(
          "Session đã hết hạn. Hãy lấy Link4M mới."
        );

      }

      throw new Error(
        data.error ||
        "Không thể nhận Key."
      );

    }


    /*
     * Hiển thị Key
     */

    document.getElementById(
      "key"
    ).textContent =
      data.key;


    document.getElementById(
      "keySection"
    ).style.display =
      "block";


    setStatus(
      "✓ Xác thực thành công — Key đã được cấp.",
      "ok"
    );


    /*
     * Xóa session khỏi thanh địa chỉ
     */

    window.history.replaceState(
      {},
      document.title,
      window.location.pathname
    );

  }

  catch (error) {

    console.error(
      "GET KEY ERROR:",
      error
    );


    setStatus(
      "❌ " +
      (
        error.message ||
        "Không thể xác thực."
      ),
      "error"
    );

  }

}


/*
 * ==========================================
 * COPY KEY
 * ==========================================
 */

async function copyKey() {

  const key =
    document
      .getElementById("key")
      .textContent
      .trim();


  if (
    !key ||
    key === "—"
  ) {

    return;

  }


  try {

    await navigator
      .clipboard
      .writeText(key);


    alert(
      "✓ Đã sao chép Key!"
    );

  }

  catch (error) {

    const textarea =
      document.createElement(
        "textarea"
      );

    textarea.value =
      key;

    document.body.appendChild(
      textarea
    );

    textarea.select();

    document.execCommand(
      "copy"
    );

    document.body.removeChild(
      textarea
    );

    alert(
      "✓ Đã sao chép Key!"
    );

  }

}


/*
 * ==========================================
 * START
 * ==========================================
 */

loadKey();

</script>

</body>

</html>
