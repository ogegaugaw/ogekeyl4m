<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Nhận Key</title>

<style>

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    font-family:
        Arial,
        sans-serif;

    background: #07070a;
    color: white;
}

.card {
    width: calc(100% - 40px);
    max-width: 400px;

    padding: 25px;

    box-sizing: border-box;

    border-radius: 24px;

    background:
        rgba(255,255,255,.07);

    border:
        1px solid
        rgba(255,255,255,.14);

    box-shadow:
        0 25px 70px
        rgba(0,0,0,.5);

    backdrop-filter:
        blur(25px);

    -webkit-backdrop-filter:
        blur(25px);

    text-align: center;
}

h2 {
    margin-top: 0;
}

#status {
    margin-top: 15px;
    color: #fbbf24;
    line-height: 1.5;
}

#keyBox {
    margin-top: 20px;
}

#key {
    width: 100%;

    box-sizing: border-box;

    padding: 13px;

    border-radius: 12px;

    border:
        1px solid
        rgba(255,255,255,.15);

    background:
        rgba(255,255,255,.05);

    color: #86efac;

    font-weight: bold;

    text-align: center;
}

button {
    width: 100%;

    margin-top: 12px;

    padding: 13px;

    border: 0;

    border-radius: 12px;

    background:
        linear-gradient(
            135deg,
            #3b82f6,
            #2563eb
        );

    color: white;

    font-weight: bold;

    cursor: pointer;
}

.error {
    color: #f87171 !important;
}

.success {
    color: #4ade80 !important;
}

</style>

</head>

<body>

<div class="card">

    <h2>🔑 Key của bạn</h2>

    <div id="status">
        Đang xác thực...
    </div>

    <div
        id="keyBox"
        style="display:none"
    >

        <input
            id="key"
            readonly
        >

        <button onclick="copyKey()">
            COPY KEY
        </button>

    </div>

</div>


<script>

/*
 * =========================================
 * BACKEND
 * =========================================
 */

const BACKEND_URL =
    "https://meizulover-key-backend.onrender.com";


/*
 * =========================================
 * SESSION
 * =========================================
 */

const params =
    new URLSearchParams(
        window.location.search
    );

const session =
    params.get("session");


/*
 * =========================================
 * STATUS
 * =========================================
 */

function setStatus(
    message,
    type
) {

    const status =
        document.getElementById(
            "status"
        );

    status.textContent =
        message;

    status.className =
        type || "";

}


/*
 * =========================================
 * LOAD KEY
 * =========================================
 */

async function loadKey() {

    if (!session) {

        setStatus(
            "❌ Liên kết không hợp lệ.",
            "error"
        );

        return;
    }


    try {

        /*
         * Bước 1:
         * kiểm tra session
         */

        setStatus(
            "Đang kiểm tra liên kết...",
            ""
        );


        const infoResponse =
            await fetch(
                BACKEND_URL +
                "/session-info",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            session:
                                session
                        })

                }
            );


        if (!infoResponse.ok) {

            throw new Error(
                "Backend HTTP " +
                infoResponse.status
            );

        }


        const info =
            await infoResponse.json();


        if (!info.success) {

            if (
                info.error ===
                "SESSION_EXPIRED"
            ) {

                setStatus(
                    "❌ Session đã hết hạn. Hãy lấy Link4M mới.",
                    "error"
                );

            } else {

                setStatus(
                    "❌ Liên kết không hợp lệ. Hãy lấy Link4M mới.",
                    "error"
                );

            }

            return;
        }


        /*
         * Nếu key đã được claim
         */

        if (info.claimed === true) {

            setStatus(
                "❌ Key đã được nhận trước đó.",
                "error"
            );

            return;
        }


        /*
         * Bước 2:
         * claim key
         */

        setStatus(
            "Đang nhận Key...",
            ""
        );


        const claimResponse =
            await fetch(
                BACKEND_URL +
                "/claim",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            session:
                                session
                        })

                }
            );


        if (!claimResponse.ok) {

            throw new Error(
                "Claim HTTP " +
                claimResponse.status
            );

        }


        const data =
            await claimResponse.json();


        if (!data.success) {

            if (
                data.error ===
                "KEY_ALREADY_CLAIMED"
            ) {

                setStatus(
                    "❌ Key đã được nhận trước đó.",
                    "error"
                );

            } else if (
                data.error ===
                "SESSION_EXPIRED"
            ) {

                setStatus(
                    "❌ Link4M đã hết hạn. Hãy lấy Link4M mới.",
                    "error"
                );

            } else {

                setStatus(
                    "❌ Không thể nhận Key: " +
                    (
                        data.error ||
                        "UNKNOWN_ERROR"
                    ),
                    "error"
                );

            }

            return;
        }


        /*
         * Bước 3:
         * hiển thị Key
         */

        document
            .getElementById("key")
            .value =
            data.key;


        document
            .getElementById("keyBox")
            .style.display =
            "block";


        setStatus(
            "✅ Nhận Key thành công!",
            "success"
        );

    }

    catch (error) {

        console.error(
            "GET KEY ERROR:",
            error
        );


        setStatus(
            "❌ Không kết nối được backend.",
            "error"
        );

    }

}


/*
 * =========================================
 * COPY KEY
 * =========================================
 */

async function copyKey() {

    const key =
        document
            .getElementById("key")
            .value;


    if (!key) {
        return;
    }


    try {

        await navigator
            .clipboard
            .writeText(key);


        alert(
            "Đã copy key"
        );

    }

    catch (error) {

        const input =
            document
                .getElementById("key");

        input.select();

        document.execCommand(
            "copy"
        );

        alert(
            "Đã copy key"
        );

    }

}


/*
 * =========================================
 * START
 * =========================================
 */

loadKey();

</script>

</body>

</html>
