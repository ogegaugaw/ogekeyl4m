<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lấy Key Kích Hoạt</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f6f9; display: flex; justify-content: center;
      align-items: center; min-height: 100vh; padding: 15px;
    }
    .card {
      background: #ffffff; padding: 28px 20px; border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08); text-align: center;
      max-width: 420px; width: 100%;
    }
    .card h2 { color: #1a1a1a; font-size: 20px; margin-bottom: 8px; }
    .card p { font-size: 14px; color: #666; margin-bottom: 20px; }
    .key-box {
      font-size: 18px; font-weight: 800; color: #28a745;
      background: #f4fbf7; padding: 14px; border-radius: 10px;
      border: 2px dashed #28a745; margin: 15px 0; word-break: break-all;
      letter-spacing: 1px;
    }
    .btn-copy {
      background: #007bff; color: white; border: none; padding: 12px;
      border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 700;
      width: 100%; transition: background 0.2s;
    }
    .btn-copy:hover { background: #0056b3; }
    #status { color: #fd7e14; font-size: 14px; font-weight: 600; margin: 15px 0; word-break: break-word; }
    .note { font-size: 12px; color: #dc3545; margin-top: 15px; font-style: italic; }
  </style>

  <!-- Firebase SDK v8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <div class="card">
    <h2>🔑 KEY CỦA BẠN</h2>
    <p>Xác thực thành công qua Link4m</p>
    
    <div id="status">⏳ Đang kết nối hệ thống...</div>
    
    <div id="key-section" style="display: none;">
      <div class="key-box" id="generatedKey">meizulover_XXXXXXXXX</div>
      <button class="btn-copy" onclick="copyKey()">SAO CHÉP KEY</button>
      <p class="note">* Key chỉ sử dụng 1 LẦN. Hệ thống sẽ tự xóa Key ngay khi bạn kích hoạt vào App.</p>
    </div>
  </div>

  <script>
    // Cấu hình kết nối Firebase ogekeyl4m (Singapore)
    const firebaseConfig = {
      apiKey: "AIzaSyAhHdsZw5xwq_hmtU_oe9ELSgEw6L6pxvY",
      authDomain: "ogekeyl4m.firebaseapp.com",
      databaseURL: "https://ogekeyl4m-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "ogekeyl4m",
      storageBucket: "ogekeyl4m.firebasestorage.app",
      messagingSenderId: "737277929162",
      appId: "1:737277929162:web:0a75c0f0a447d7ad63f633",
      measurementId: "G-JXG8PS8722"
    };

    function updateStatus(msg, isError = false) {
      const statusEl = document.getElementById('status');
      statusEl.innerText = msg;
      if (isError) statusEl.style.color = '#dc3545';
    }

    try {
      firebase.initializeApp(firebaseConfig);
      const database = firebase.database();

      // Hàm sinh Key dạng meizulover_ + 9 ký tự viết hoa/số
      function generateMeizuKey(length = 9) {
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        let result = '';
        for (let i = 0; i < length; i++) {
          result += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return 'meizulover_' + result;
      }

      const newKey = generateMeizuKey();
      updateStatus("⏳ Đang lưu Key lên Firebase...");

      database.ref('keys/' + newKey).set({
        created_at: new Date().toISOString()
      }).then(() => {
        document.getElementById('status').style.display = 'none';
        document.getElementById('generatedKey').innerText = newKey;
        document.getElementById('key-section').style.display = 'block';
      }).catch((error) => {
        updateStatus('❌ Lỗi ghi Firebase: ' + error.message, true);
      });
    } catch (e) {
      updateStatus("❌ Lỗi khởi tạo Firebase: " + e.message, true);
    }

    function copyKey() {
      const keyText = document.getElementById('generatedKey').innerText;
      navigator.clipboard.writeText(keyText).then(() => {
        alert('✅ Đã sao chép: ' + keyText);
      }).catch(() => {
        alert('Key của bạn là: ' + keyText);
      });
    }
  </script>
</body>
</html>
