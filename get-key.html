<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1">

<title>Nhận Key LoveMeizu</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {

  min-height: 100vh;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 20px;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  color: white;

  background:
    radial-gradient(
      600px 400px at 10% 0%,
      rgba(59,130,246,.25),
      transparent 65%
    ),
    #050609;
}

.card {

  width: 100%;
  max-width: 420px;

  padding: 30px 22px;

  border-radius: 28px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.10),
      rgba(255,255,255,.035)
    );

  border: 1px solid
    rgba(255,255,255,.14);

  backdrop-filter:
    blur(28px)
    saturate(140%);

  -webkit-backdrop-filter:
    blur(28px)
    saturate(140%);

  box-shadow:
    inset 0 1px
      rgba(255,255,255,.10),
    0 30px 80px
      rgba(0,0,0,.55);
}

.badge {

  display: inline-block;

  padding: 6px 11px;

  border-radius: 999px;

  color: #bfdbfe;

  background:
    rgba(59,130,246,.1);

  border: 1px solid
    rgba(96,165,250,.2);

  font-size: 10px;
  font-weight: 700;

  letter-spacing: .07em;

  margin-bottom: 15px;
}

h1 {

  font-size: 23px;

  margin-bottom: 8px;
}

.sub {

  color: #a5a9b3;

  font-size: 13px;

  line-height: 1.6;

  margin-bottom: 20px;
}

.status {

  padding: 14px;

  border-radius: 15px;

  color: #fbbf24;

  background:
    rgba(255,255,255,.045);

  border: 1px solid
    rgba(255,255,255,.08);

  font-size: 13px;

  font-weight: 600;
}

.status.ok {

  color: #86efac;

  background:
    rgba(34,197,94,.07);

  border-color:
    rgba(34,197,94,.20);
}

.status.error {

  color: #fca5a5;

  background:
    rgba(239,68,68,.07);

  border-color:
    rgba(239,68,68,.20);
}

.key-section {

  display: none;

  margin-top: 18px;
}

.label {

  color: #8f95a1;

  font-size: 10px;

  font-weight: 700;

  letter-spacing: .08em;

  text-transform: uppercase;

  margin-bottom: 7px;
}

.key {

  padding: 16px;

  border-radius: 16px;

  color: #86efac;

  background:
    rgba(34,197,94,.08);

  border: 1px solid
    rgba(34,197,94,.28);

  font-size: 15px;

  font-weight: 800;

  word-break: break-all;

  margin-bottom: 10px;
}

button {

  width: 100%;

  padding: 14px;

  border: 0;

  border-radius: 15px;

  color: white;

  background:
    linear-gradient(
      135deg,
      #3b82f6,
      #2563eb
    );

  font-size: 14px;

  font-weight: 800;

  cursor: pointer;

  box-shadow:
    0 10px 28px
    rgba(37,99,235,.28);
}

button:active {
  transform: scale(.98);
}

.note {

  margin-top: 14px;

  padding: 12px;

  border-radius: 13px;

  color: #aeb3bd;

  background:
    rgba(255,255,255,.035);

  font-size: 11px;

  line-height: 1.55;
}

.footer {

  margin-top: 20px;

  text-align: center;

  color: #666b76;

  font-size: 10px;
}

</style>

</head>

<body>

<div class="card">

  <div class="badge">
    ● SECURE ONE-TIME KEY
  </div>

  <h1>
    🔑 KEY CỦA BẠN
  </h1>

  <p class="sub">
    Hệ thống đang kiểm tra token xác thực
    của lượt Link4m này.
  </p>

  <div
    id="status"
    class="status">

    ⏳ Đang xác thực...

  </div>

  <div
    id="keySection"
    class="key-section">

    <div class="label">
      Activation Key
    </div>

    <div
      id="key"
      class="key">
      —
    </div>

    <button
      onclick="copyKey()">

      SAO CHÉP KEY

    </button>

    <div class="note">

      ⚠️ Key chỉ có thể sử dụng
      một lần. Sau khi APK xác nhận
      thành công, key sẽ bị vô hiệu hóa.

    </div>

  </div>

  <div class="footer">
    make by lovemeizu
  </div>

</div>

<script>

function getToken() {

  return new URLSearchParams(
    window.location.search
  ).get("token");

}

async function claim() {

  const token =
    getToken();

  /*
   * Không có token:
   *
   * /get-key.html?from=link4m
   *
   * => TỪ CHỐI
   */

  if (!token) {

    setStatus(
      "❌ Liên kết không hợp lệ. Hãy lấy Link4m mới.",
      "error"
    );

    return;
  }

  try {

    setStatus(
      "⏳ Đang xác thực token...",
      ""
    );

    const response =
      await fetch(
        "/api/claim",
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            token: token
          })

        }
      );

    const data =
      await response.json();

    /*
     * Xóa token khỏi URL
     */

    window.history.replaceState(
      {},
      document.title,
      window.location.pathname
    );

    if (
      !response.ok ||
      !data.success
    ) {

      throw new Error(
        data.message ||
        "Token không hợp lệ."
      );
    }

    document.getElementById(
      "key"
    ).textContent =
      data.key;

    document.getElementById(
      "keySection"
    ).style.display =
      "block";

    setStatus(
      "✓ Xác thực thành công — Key đã được cấp.",
      "ok"
    );

  } catch (error) {

    setStatus(
      "❌ " +
      (
        error.message ||
        "Không thể xác thực."
      ),
      "error"
    );

  }

}

function setStatus(
  text,
  type
) {

  const el =
    document.getElementById(
      "status"
    );

  el.textContent = text;

  el.className =
    "status " +
    (type || "");

}

async function copyKey() {

  const key =
    document.getElementById(
      "key"
    ).textContent;

  try {

    await navigator.clipboard
      .writeText(key);

    alert(
      "✓ Đã sao chép Key!"
    );

  } catch (e) {

    alert(key);

  }

}

claim();

</script>

</body>

</html>
