<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Nhận Key Beta · LoveMeizu</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#050609;
  --glass:rgba(255,255,255,.065);
  --stroke:rgba(255,255,255,.12);
  --text:#f7f8fb;
  --muted:#989ba6;
  --blue:#4b8dff;
  --green:#39dc7b;
  --red:#ff6868;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  min-height:100%;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;

  font-family:
    "Plus Jakarta Sans",
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  color:var(--text);

  background:
    radial-gradient(
      600px 420px at 0% 0%,
      rgba(70,125,255,.17),
      transparent 68%
    ),
    radial-gradient(
      500px 400px at 100% 100%,
      rgba(0,190,255,.10),
      transparent 68%
    ),
    #050609;

  overflow-x:hidden;
}

/* =========================
   BACKGROUND
========================= */

body::before,
body::after{
  content:"";
  position:fixed;
  pointer-events:none;
  border-radius:50%;
  filter:blur(45px);
  z-index:0;
}

body::before{
  width:330px;
  height:330px;
  left:-170px;
  top:-150px;

  background:
    radial-gradient(
      circle,
      rgba(70,135,255,.22),
      transparent 68%
    );

  animation:liquidOne 11s ease-in-out infinite;
}

body::after{
  width:360px;
  height:360px;
  right:-180px;
  bottom:-170px;

  background:
    radial-gradient(
      circle,
      rgba(0,205,255,.13),
      transparent 68%
    );

  animation:liquidTwo 13s ease-in-out infinite;
}

@keyframes liquidOne{
  0%,100%{
    transform:translate(0,0) scale(1);
  }

  50%{
    transform:translate(145px,105px) scale(1.18);
  }
}

@keyframes liquidTwo{
  0%,100%{
    transform:translate(0,0) scale(1);
  }

  50%{
    transform:translate(-130px,-100px) scale(1.15);
  }
}

/* =========================
   MAIN
========================= */

.shell{
  width:100%;
  max-width:430px;
  position:relative;
  z-index:2;
}

.card{
  position:relative;
  overflow:hidden;

  padding:25px 21px 20px;

  border-radius:30px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.095),
      rgba(255,255,255,.028)
    );

  border:1px solid var(--stroke);

  backdrop-filter:
    blur(30px)
    saturate(155%);

  -webkit-backdrop-filter:
    blur(30px)
    saturate(155%);

  box-shadow:
    0 35px 90px rgba(0,0,0,.58),
    inset 0 1px 0 rgba(255,255,255,.15),
    inset 0 -1px 0 rgba(255,255,255,.025);

  animation:
    cardIn .65s cubic-bezier(.2,.8,.2,1);
}

@keyframes cardIn{
  from{
    opacity:0;
    transform:translateY(18px) scale(.97);
  }

  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

/* =========================
   GLASS
========================= */

.card::before{
  content:"";

  position:absolute;
  inset:-45%;

  background:
    linear-gradient(
      115deg,
      transparent 38%,
      rgba(255,255,255,.075) 48%,
      transparent 58%
    );

  transform:
    translateX(-65%)
    rotate(8deg);

  animation:
    glassShine 8s ease-in-out infinite;

  pointer-events:none;
}

@keyframes glassShine{
  0%,45%{
    transform:
      translateX(-65%)
      rotate(8deg);
  }

  70%,100%{
    transform:
      translateX(65%)
      rotate(8deg);
  }
}

/* =========================
   HEADER
========================= */

.top{
  position:relative;
  z-index:1;

  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-bottom:21px;
}

.icon{
  width:47px;
  height:47px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:15px;

  font-size:20px;

  background:
    linear-gradient(
      145deg,
      rgba(80,145,255,.20),
      rgba(255,255,255,.04)
    );

  border:1px solid rgba(105,160,255,.23);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.13),
    0 8px 28px rgba(45,110,255,.13);
}

.live{
  display:flex;
  align-items:center;
  gap:7px;

  padding:7px 11px;

  border-radius:999px;

  color:#a9caff;

  font-size:9px;
  font-weight:800;

  letter-spacing:.08em;
  text-transform:uppercase;

  background:rgba(59,130,246,.075);

  border:1px solid rgba(80,145,255,.18);
}

.live-dot{
  width:6px;
  height:6px;

  border-radius:50%;

  background:#61a1ff;

  box-shadow:
    0 0 10px rgba(80,150,255,.9);

  animation:pulse 1.8s ease-in-out infinite;
}

@keyframes pulse{
  0%,100%{
    opacity:.45;
    transform:scale(.8);
  }

  50%{
    opacity:1;
    transform:scale(1.15);
  }
}

/* =========================
   CONTENT
========================= */

.content{
  position:relative;
  z-index:1;
}

h1{
  font-size:25px;
  line-height:1.15;
  font-weight:800;
  letter-spacing:-.045em;
  margin-bottom:9px;
}

.sub{
  color:var(--muted);
  font-size:13px;
  line-height:1.65;
  margin-bottom:22px;
}

.sub b{
  color:#e1eaff;
}

/* =========================
   STATUS
========================= */

.status-wrap{
  display:flex;
  align-items:center;
  gap:9px;

  min-height:23px;

  margin-top:14px;
  padding:0 2px;
}

.status-icon{
  width:7px;
  height:7px;

  flex:none;

  border-radius:50%;

  background:#f7c948;

  box-shadow:
    0 0 9px rgba(247,201,72,.55);

  animation:pulse 1.8s infinite;
}

#status{
  color:#c7c8ce;

  font-size:11.5px;
  font-weight:600;
  line-height:1.5;

  white-space:pre-line;
  word-break:break-word;
}

#status.err{
  color:#ff8585;
}

#status.ok{
  color:#62e596;
}

/* =========================
   RESULT
========================= */

#result{
  display:none;

  margin-top:18px;
  padding-top:17px;

  border-top:
    1px solid rgba(255,255,255,.075);

  animation:resultIn .45s ease;
}

@keyframes resultIn{
  from{
    opacity:0;
    transform:translateY(8px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

.label{
  display:flex;
  align-items:center;
  gap:7px;

  margin-bottom:8px;

  color:#858894;

  font-size:9px;
  font-weight:800;

  letter-spacing:.09em;
  text-transform:uppercase;
}

.label::before{
  content:"";

  width:5px;
  height:5px;

  border-radius:50%;

  background:#638fff;

  box-shadow:
    0 0 8px rgba(70,130,255,.7);
}

.box{
  min-height:52px;

  display:flex;
  align-items:center;

  padding:13px 14px;

  border-radius:15px;

  font-size:12px;
  font-weight:700;
  line-height:1.5;

  word-break:break-all;

  background:
    rgba(255,255,255,.035);

  border:
    1px solid rgba(255,255,255,.08);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.045);
}

.box.key{
  color:#83efa9;

  background:
    linear-gradient(
      135deg,
      rgba(35,210,110,.075),
      rgba(255,255,255,.025)
    );

  border-color:
    rgba(55,220,125,.22);

  text-shadow:
    0 0 18px rgba(50,220,120,.12);
}

/* =========================
   BUTTON
========================= */

.btn{
  position:relative;

  width:100%;

  border:0;
  border-radius:16px;

  padding:15px 16px;
  margin-top:10px;

  font-family:inherit;

  font-size:13.5px;
  font-weight:800;

  color:#fff;

  cursor:pointer;
  overflow:hidden;

  transition:
    transform .18s ease,
    box-shadow .2s ease,
    opacity .2s ease;
}

.btn::before{
  content:"";

  position:absolute;
  inset:0;

  background:
    linear-gradient(
      110deg,
      transparent 25%,
      rgba(255,255,255,.17),
      transparent 75%
    );

  transform:translateX(-100%);

  transition:
    transform .55s ease;
}

.btn:hover::before{
  transform:translateX(100%);
}

.btn:active{
  transform:scale(.975);
}

.btn-copy{
  background:
    linear-gradient(
      135deg,
      #35d978,
      #19ae59
    );

  box-shadow:
    0 10px 28px rgba(30,200,100,.20);
}

.btn-copy:hover{
  box-shadow:
    0 14px 35px rgba(30,200,100,.32);
}

/* =========================
   FOOTER
========================= */

.foot{
  position:relative;
  z-index:1;

  margin-top:20px;

  color:#656872;

  text-align:center;

  font-size:10px;
  line-height:1.5;
}

.foot span{
  color:#8b8e98;
}

/* =========================
   MOBILE
========================= */

@media(max-width:380px){

  body{
    padding:13px;
  }

  .card{
    padding:23px 18px 19px;
    border-radius:26px;
  }

  h1{
    font-size:22px;
  }

  .sub{
    font-size:12.5px;
  }

}
</style>
</head>

<body>

<div class="shell">

  <div class="card">

    <div class="top">

      <div class="icon">
        🔑
      </div>

      <div class="live">

        <span class="live-dot"></span>

        Secure Key

      </div>

    </div>

    <div class="content">

      <h1>
        Nhận Key Beta
      </h1>

      <p class="sub">
        Key <b>dùng một lần</b> của bạn
        sẽ được hiển thị sau khi xác nhận
        liên kết thành công.
      </p>

      <div class="status-wrap">

        <span
          class="status-icon"
          id="statusDot">
        </span>

        <div id="status">
          Đang xác nhận liên kết...
        </div>

      </div>

      <div id="result">

        <div class="label">
          Access Key
        </div>

        <div
          class="box key"
          id="outKey">
          —
        </div>

        <button
          class="btn btn-copy"
          id="copyButton"
          type="button">

          Sao chép Key

        </button>

      </div>

    </div>

    <p class="foot">

      <span>
        One-time Key System
      </span>

      · LoveMeizu

    </p>

  </div>

</div>


<script>
"use strict";

/* =========================
   CONFIG
========================= */

const BACKEND_URL =
  "https://meizulover-key-backend.onrender.com";

const REQUEST_TIMEOUT = 15000;


/* =========================
   GET TOKEN
========================= */

const params =
  new URLSearchParams(
    window.location.search
  );

const token =
  (
    params.get("token") ||
    params.get("t") ||
    ""
  ).trim();


/* =========================
   ELEMENTS
========================= */

const statusEl =
  document.getElementById("status");

const statusDot =
  document.getElementById("statusDot");

const result =
  document.getElementById("result");

const outKey =
  document.getElementById("outKey");

const copyButton =
  document.getElementById("copyButton");


/* =========================
   STATE
========================= */

let claiming = false;
let claimedKey = null;


/* =========================
   STATUS
========================= */

function setStatus(
  message,
  type = ""
) {

  statusEl.textContent =
    String(message || "");

  statusEl.className =
    type;


  if (type === "ok") {

    statusDot.style.background =
      "#39dc7b";

    statusDot.style.boxShadow =
      "0 0 9px rgba(57,220,123,.65)";

  }

  else if (type === "err") {

    statusDot.style.background =
      "#ff6868";

    statusDot.style.boxShadow =
      "0 0 9px rgba(255,104,104,.65)";

  }

  else {

    statusDot.style.background =
      "#f7c948";

    statusDot.style.boxShadow =
      "0 0 9px rgba(247,201,72,.55)";

  }

}


/* =========================
   HIDE RESULT
========================= */

function hideResult() {

  result.style.display =
    "none";

  outKey.textContent =
    "—";

}


/* =========================
   API REQUEST
========================= */

async function request(
  endpoint,
  body
) {

  const controller =
    new AbortController();

  const timeout =
    setTimeout(
      function () {

        controller.abort();

      },
      REQUEST_TIMEOUT
    );


  try {

    const response =
      await fetch(
        BACKEND_URL + endpoint,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "Accept":
              "application/json"
          },

          body:
            JSON.stringify(body),

          cache:
            "no-store",

          signal:
            controller.signal
        }
      );


    const text =
      await response.text();


    let data = null;


    try {

      data =
        text
          ? JSON.parse(text)
          : null;

    }

    catch (_) {

      throw new Error(
        "SERVER_INVALID_RESPONSE"
      );

    }


    if (!response.ok) {

      throw new Error(
        data?.error ||
        "SERVER_ERROR"
      );

    }


    return data;

  }

  catch (error) {

    if (
      error?.name ===
      "AbortError"
    ) {

      throw new Error(
        "REQUEST_TIMEOUT"
      );

    }

    throw error;

  }

  finally {

    clearTimeout(timeout);

  }

}


/* =========================
   CLAIM ERROR
========================= */

function showClaimError(error) {

  switch (
    String(error || "")
  ) {

    case "LINK4M_NOT_COMPLETED":

      setStatus(
        "Bạn chưa hoàn thành Link4M.\nHãy hoàn thành liên kết rồi quay lại trang này.",
        "err"
      );

      break;


    case "KEY_ALREADY_CLAIMED":

      setStatus(
        "Key này đã được nhận trước đó.",
        "err"
      );

      break;


    case "KEY_USED":

      setStatus(
        "Key này đã được sử dụng.",
        "err"
      );

      break;


    case "INVALID_TOKEN":

      setStatus(
        "Token không hợp lệ hoặc đã hết hạn.",
        "err"
      );

      break;


    case "KEY_NOT_FOUND":

      setStatus(
        "Không tìm thấy Key tương ứng.",
        "err"
      );

      break;


    case "MISSING_TOKEN":

      setStatus(
        "Liên kết không hợp lệ hoặc thiếu token.",
        "err"
      );

      break;


    case "REQUEST_TIMEOUT":

      setStatus(
        "Máy chủ phản hồi quá lâu.\nVui lòng thử lại.",
        "err"
      );

      break;


    case "SERVER_INVALID_RESPONSE":

      setStatus(
        "Máy chủ trả về dữ liệu không hợp lệ.",
        "err"
      );

      break;


    default:

      setStatus(
        "Không thể nhận Key.\nVui lòng thử lại sau.",
        "err"
      );

  }

}


/* =========================
   LOAD KEY
========================= */

async function loadKey() {

  if (claiming) {
    return;
  }


  if (!token) {

    hideResult();

    setStatus(
      "Liên kết không hợp lệ hoặc thiếu token.",
      "err"
    );

    return;

  }


  if (claimedKey) {
    return;
  }


  claiming = true;

  hideResult();


  try {

    setStatus(
      "Đang xác nhận liên kết..."
    );


    /*
     * Chỉ đọc trạng thái session.
     *
     * Không tin frontend để xác nhận
     * Link4M.
     */

    const info =
      await request(
        "/session-info",
        {
          token:token
        }
      );


    if (
      !info ||
      info.success !== true
    ) {

      showClaimError(
        info?.error ||
        "INVALID_TOKEN"
      );

      return;

    }


    if (
      info.used === true
    ) {

      setStatus(
        "Key này đã được sử dụng.",
        "err"
      );

      return;

    }


    /*
     * Không tự đặt:
     *
     * link4m_verified = true
     *
     * Không gửi:
     *
     * verified:true
     *
     * Backend sẽ tự quyết định.
     */


    setStatus(
      "Đang xác nhận điều kiện...\nVui lòng chờ..."
    );


    const data =
      await request(
        "/claim",
        {
          token:token
        }
      );


    if (
      !data ||
      data.success !== true
    ) {

      showClaimError(
        data?.error
      );

      return;

    }


    /*
     * Chỉ hiển thị Key khi backend
     * thực sự trả về success + key.
     */

    if (
      typeof data.key !== "string" ||
      !data.key.trim()
    ) {

      setStatus(
        "Máy chủ không trả về Key hợp lệ.",
        "err"
      );

      return;

    }


    const key =
      data.key.trim();


    claimedKey =
      key;


    outKey.textContent =
      key;

    result.style.display =
      "block";


    setStatus(
      "Nhận Key thành công!",
      "ok"
    );


    /*
     * Xóa token khỏi URL sau khi
     * claim thành công.
     */

    try {

      window.history.replaceState(
        {},
        document.title,
        window.location.pathname
      );

    }

    catch (error) {

      console.warn(
        "Cannot clean URL:",
        error
      );

    }


  }

  catch (error) {

    console.error(
      "GET KEY ERROR:",
      error
    );


    showClaimError(
      error?.message
    );

  }

  finally {

    claiming = false;

  }

}


/* =========================
   COPY KEY
========================= */

async function copyKey() {

  const key =
    outKey.textContent.trim();


  if (
    !key ||
    key === "—"
  ) {

    return;

  }


  try {

    if (
      navigator.clipboard &&
      window.isSecureContext
    ) {

      await navigator.clipboard.writeText(
        key
      );

    }

    else {

      throw new Error(
        "CLIPBOARD_UNAVAILABLE"
      );

    }


    const oldText =
      copyButton.textContent;


    copyButton.textContent =
      "✓ Đã sao chép Key";


    setStatus(
      "Key đã được sao chép!",
      "ok"
    );


    setTimeout(
      function () {

        copyButton.textContent =
          oldText;

      },
      1800
    );


  }

  catch (error) {

    try {

      const textarea =
        document.createElement(
          "textarea"
        );


      textarea.value =
        key;


      textarea.setAttribute(
        "readonly",
        ""
      );


      textarea.style.position =
        "fixed";

      textarea.style.left =
        "-9999px";

      textarea.style.top =
        "0";

      textarea.style.opacity =
        "0";


      document.body.appendChild(
        textarea
      );


      textarea.focus();

      textarea.select();


      const copied =
        document.execCommand(
          "copy"
        );


      textarea.remove();


      if (!copied) {

        throw new Error(
          "COPY_FAILED"
        );

      }


      const oldText =
        copyButton.textContent;


      copyButton.textContent =
        "✓ Đã sao chép Key";


      setStatus(
        "Key đã được sao chép!",
        "ok"
      );


      setTimeout(
        function () {

          copyButton.textContent =
            oldText;

        },
        1800
      );

    }

    catch (fallbackError) {

      console.warn(
        "COPY ERROR:",
        fallbackError
      );


      setStatus(
        "Không thể tự sao chép.\nHãy nhấn giữ Key để sao chép.",
        "err"
      );

    }

  }

}


/* =========================
   COPY BUTTON
========================= */

copyButton.addEventListener(
  "click",
  function () {

    copyKey();

  }
);


/* =========================
   START
========================= */

loadKey();

</script>

</body>
</html>
